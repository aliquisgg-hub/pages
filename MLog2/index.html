<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Drive API on GitHub Pages</title>
</head>
<body>
    <button id="authorize_button" onclick="handleAuthClick()">ログイン</button>
    <button id="signout_button" onclick="handleSignoutClick()" style="display:none;">ログアウト</button>
    <pre id="content" style="white-space: pre-wrap;"></pre>

    
    <script async defer src="https://google.com" onload="gisLoaded()"></script>
    <!-- Google API Client Library -->
    <script async defer src="https://google.com" onload="gapiLoaded()"></script>

    <script>
        const CLIENT_ID = '469052316276-5ag6b0o533ic861d80kpbhgoso877gel.apps.googleusercontent.com';
        const API_KEY = '';
        const DISCOVERY_DOC = 'https://googleapis.com';
        const SCOPES = 'https://googleapis.com'; // 読み取り専用の場合

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
            maybeEnableButton();
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // 後で動的に設定
            });
            gisInited = true;
            maybeEnableButton();
        }

        function maybeEnableButton() {
            if (gapiInited && gisInited) {
                document.getElementById('authorize_button').style.display = 'block';
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw (resp);
                }
                document.getElementById('signout_button').style.display = 'block';
                document.getElementById('authorize_button').innerText = '更新';
                listfiles();
            };

            if (gapi.client.getToken() === null) {
                // プロンプトを出して同意画面を表示
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token, () => {
                    gapi.client.setToken('');
                    document.getElementById('content').innerText = '';
                    document.getElementById('authorize_button').innerText = 'ログイン';
                    document.getElementById('signout_button').style.display = 'none';
                });
            }
        }

        async function listfiles() {
            let response;
            try {
                response = await gapi.client.drive.files.list({
                    'pageSize': 10,
                    'fields': 'files(id, name)',
                });
            } catch (err) {
                document.getElementById('content').innerText = err.message;
                return;
            }
            const files = response.result.files;
            if (!files || files.length === 0) {
                document.getElementById('content').innerText = 'ファイルが見つかりません。';
                return;
            }
            let output = 'ファイル一覧:\n';
            files.forEach((file) => {
                output += `${file.name} (${file.id})\n`;
            });
            document.getElementById('content').innerText = output;
        }
    </script>
</body>
</html>
