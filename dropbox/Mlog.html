<!doctype html>
<html>
<head>
<meta name="viewport" content="width=360">
<title>MLog</title>
<script src="Dropbox-sdk.min.js">
    // from https://cdnjs.com/libraries/dropbox.js/
    // https://cdnjs.cloudflare.com/ajax/libs/dropbox.js/2.5.13/Dropbox-sdk.min.js
</script>
<script src="Mlog8.js"></script>
<script>
if (!(token=localStorage.getItem("MLog"))) {
  let tok = prompt("access token?");
  if (tok) {
    localStorage.setItem("MLog", tok);
    location.reload(true);
  }
}

var opts = { r: "Mlog", t: "Tmpl"};
if (location.search) {
  location.search.slice(1).split('&').forEach((p)=>{
    var [k, v] = p.split("=");
    opts[k] = v;
  });
}

var mlog = new Mlog(token, opts.r, opts.t);
window.addEventListener("load", mlog.run, false);
//window.addEventListener('resize', function (e) { location.reload(true); }, false);

</script>
</head>
<body></body>
</html>
